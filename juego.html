<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BANG BANG</title>
    <link rel="stylesheet" type="text/css" href="estilos.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto+Slab:wght@100..900&family=Sancreek&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
    <div class="bg-transicion bg-transicion-show"></div>

    <div class="ganador-overlay" id="ganadorOverlay">
        <div class="ganador-contenido">
            <div class="ganador-texto">¡<span id="nombreGanador"></span> GANA!</div>
            <button onclick="restart()" class="restart">VOLVER A JUGAR</button>
        </div>
    </div>

    <div class="bg-juego">

        <div class="left" onclick="disparo1()">
            <h2 id="jugador1"></h2>
            <div class="muertes1"></div>
            <img id="personaje1" src="img/p1.png" class="img-personaje">
            <div class="vidas1"></div>

        </div>
        <div class="right" onclick="disparo2()">
            <h2 id="jugador2"></h2>
            <div class="muertes2"></div>
            <img id="personaje2" src="img/p1.png" class="img-personaje">
            <div class="vidas2"></div>

        </div>
    </div>

    <div class="conteo">
        <div class="no3"><img src="img/3.png"></div>
        <div class="no2"><img src="img/2.png"></div>
        <div class="no1"><img src="img/1.png"></div>

        <div class="msj" onclick="conteo()">LISTOS?</div>
    </div>
    <script type="text/javascript" src="funciones.js"></script>
    <script type="text/javascript">
        window.addEventListener('load', quitarBG);
        window.addEventListener('load', cargarEscenario);
    </script>
</body>
</html>
